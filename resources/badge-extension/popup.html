<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px -apple-system, system-ui, sans-serif; background: #14161c; color: #d7dbe2; margin: 0; padding: 14px; min-width: 300px; }
    h1 { font-size: 13.5px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    .logo { width: 18px; height: 18px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; }
    .logo svg { width: 11px; height: 11px; }
    h2 { font-size: 12px; margin: 14px 0 6px; color: #9aa3af; font-weight: 600; }
    .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .label { color: #9aa3af; width: 90px; flex: none; }
    .chip { background: #1d4ed8; color: #fff; border-radius: 5px; padding: 2px 8px; font-size: 12px; cursor: pointer; word-break: break-all; }
    .chip:hover { background: #2563eb; }
    footer { margin-top: 14px; text-align: center; color: #9aa3af; font-size: 11px; }
  </style>
</head>
<body>

  <h2>🌐 Location and Region</h2>
  <div class="row"><span class="label">Timezone:</span><span class="chip" id="v-timezone">—</span></div>
  <div class="row"><span class="label">Coordinates:</span><span class="chip" id="v-coords">—</span></div>
  <h2>🔒 Network and Proxy</h2>
  <div class="row"><span class="label">Visible IP:</span><span class="chip" id="v-ip">—</span></div>
  <h2>Profile</h2>
  <div class="row"><span class="label">Profile Name:</span><span class="chip" id="v-name">—</span></div>
  <div class="row"><span class="label">Profile ID:</span><span class="chip" id="v-id">—</span></div>
  <footer>Click on value to copy it</footer>
  <script src="data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
