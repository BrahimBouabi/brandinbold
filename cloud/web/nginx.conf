# Rendered at container start by the nginx image (envsubst on /etc/nginx/templates).
# PORT is injected by Railway (defaults to 80 locally). The SPA calls the API
# directly through VITE_API_URL (baked at build time) — no /api proxy, so the
# image works on any host without a Docker-Compose "api" hostname.
server {
  listen ${PORT};
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
